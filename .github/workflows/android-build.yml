name: Compilar Android (.aab)

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependencias con pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Compilar la app Web (Pixel Stack)
        env:
          PORT: 5000
          BASE_PATH: '/'
          NODE_ENV: 'production'
        run: pnpm --filter @workspace/pixel-stack build

      - name: Instalar Capacitor en el subproyecto
        run: pnpm --filter @workspace/pixel-stack add -D @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob

      - name: Preparar directorio de dist e Inicializar Capacitor
        run: |
          cd artifacts/pixel-stack
          # Asegurar que la carpeta dist exista con el index.html
          mkdir -p dist
          if [ -d "public" ]; then cp -r public/* dist/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html dist/; fi
          if [ -d "dist/public" ]; then cp -r dist/public/* dist/; fi
          
          # Ejecutar Capacitor
          pnpm capacitor init PixelStack com.pixelstack.app --web-dir dist
          pnpm capacitor add android || true
          pnpm capacitor sync android

      - name: Compilar AAB
        run: |
          cd artifacts/pixel-stack/android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Subir Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: pixel-stack-release-aab
          path: artifacts/pixel-stack/android/app/build/outputs/bundle/release/app-release.aab
