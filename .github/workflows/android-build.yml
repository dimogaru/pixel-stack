name: Compilar Android (.aab)

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependencias con pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Compilar la app Web (Pixel Stack)
        env:
          PORT: 5000
          BASE_PATH: '/'
          NODE_ENV: 'production'
        run: pnpm --filter @workspace/pixel-stack build

      - name: Instalar Capacitor en el subproyecto
        run: pnpm --filter @workspace/pixel-stack add -D @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob

      - name: Preparar directorio de dist e Inicializar Capacitor
        run: |
          cd artifacts/pixel-stack
          mkdir -p dist
          if [ -d "public" ]; then cp -r public/* dist/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html dist/; fi
          if [ -d "dist/public" ]; then cp -r dist/public/* dist/; fi
          
          pnpm capacitor init PixelStack com.pixelstack.app --web-dir dist
          pnpm capacitor add android || true
          pnpm capacitor sync android

      - name: Configurar AdMob en AndroidManifest.xml
        run: |
          MANIFEST="artifacts/pixel-stack/android/app/src/main/AndroidManifest.xml"
          ADMOB_APP_ID="ca-app-pub-9984763727647656~5245009196"
          
          # Inyectar la meta-data de AdMob dentro de <application>
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>" $MANIFEST

      - name: Generar Keystore de firma
        run: |
          cd artifacts/pixel-stack/android
          keytool -genkeypair -v -keystore release.keystore -alias pixelstack -keyalg RSA -keysize 2048 -validity 10000 -storepass pixelstackpass -keypass pixelstackpass -dname "CN=PixelStack, OU=Dev, O=PixelStack, L=Sevilla, S=Sevilla, C=ES"

      - name: Compilar AAB y Firmar
        run: |
          cd artifacts/pixel-stack/android
          chmod +x gradlew
          ./gradlew bundleRelease
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass pixelstackpass app/build/outputs/bundle/release/app-release.aab pixelstack

      - name: Subir Artifact (.aab firmado)
        uses: actions/upload-artifact@v4
        with:
          name: pixel-stack-release-aab
          path: artifacts/pixel-stack/android/app/build/outputs/bundle/release/app-release.aab

      - name: Subir Keystore de Firma (Copia de Seguridad)
        uses: actions/upload-artifact@v4
        with:
          name: pixel-stack-keystore
          path: artifacts/pixel-stack/android/release.keystore
