name: Compilar Android (.aab)

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependencias con pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Compilar la app Web (Pixel Stack)
        env:
          PORT: 5000
          BASE_PATH: '/'
          NODE_ENV: 'production'
        run: pnpm --filter @workspace/pixel-stack build

      - name: Instalar Capacitor en el subproyecto
        run: pnpm --filter @workspace/pixel-stack add -D @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob

      - name: Preparar directorio de dist e Inicializar Capacitor
        run: |
          cd artifacts/pixel-stack
          mkdir -p dist
          if [ -d "public" ]; then cp -r public/* dist/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html dist/; fi
          if [ -d "dist/public" ]; then cp -r dist/public/* dist/; fi
          
          # Si no existe configuración previa se inicializa, si ya existe se omite este paso
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            pnpm capacitor init PixelStack com.pixelstack.app --web-dir dist
          fi

          # Añade la plataforma android si no existía la carpeta
          if [ ! -d "android" ]; then
            pnpm capacitor add android || true
          fi

          # Sincroniza los archivos compilados web hacia la app nativa Android
          pnpm capacitor sync android

      - name: Incrementar VersionCode Dinámicamente
        run: |
          # Incrementar versionCode dinámicamente con el número de ejecución de GitHub
          GRADLE_FILE="artifacts/pixel-stack/android/app/build.gradle"
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/g" $GRADLE_FILE
          sed -i "s/versionName \".*\"/versionName \"1.$BUILD_NUMBER\"/g" $GRADLE_FILE

      - name: Decodificar Keystore de Firma guardado
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd artifacts/pixel-stack/android
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compilar AAB y Firmar
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd artifacts/pixel-stack/android
          chmod +x gradlew
          ./gradlew bundleRelease
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$STORE_PASS" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Subir Artifact (.aab firmado)
        uses: actions/upload-artifact@v4
        with:
          name: pixel-stack-release-aab
          path: artifacts/pixel-stack/android/app/build/outputs/bundle/release/app-release.aab
