openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scores
    description: Pixel Stack global leaderboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scores:
    get:
      operationId: listScores
      tags: [scores]
      summary: List the global leaderboard
      responses:
        "200":
          description: The ten highest scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HighScore"
    post:
      operationId: submitScore
      tags: [scores]
      summary: Submit a qualifying score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreInput"
      responses:
        "200":
          description: Score accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreSubmitResult"
        "400":
          description: Invalid score
        "429":
          description: Too many score submissions
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    HighScore:
      type: object
      required: [id, name, score, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 10
        score:
          type: integer
          minimum: 0
        created_at:
          type: string
    ScoreSubmitResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ScoreInput:
      type: object
      additionalProperties: false
      required: [name, score]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 10
          pattern: "^[A-Za-z0-9_-]+$"
        score:
          type: integer
          minimum: 1

